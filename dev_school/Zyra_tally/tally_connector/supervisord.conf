[supervisord]
nodaemon=true
logfile=/var/log/tally_connector/supervisord.log
pidfile=/var/run/supervisord.pid

[program:outbound]
command=python3 /app/main.py outbound
directory=/app
autostart=true
autorestart=true
startretries=1000
startsecs=3
stopwaitsecs=10
stdout_logfile=/var/log/tally_connector/outbound.log
stderr_logfile=/var/log/tally_connector/outbound.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:inbound]
command=python3 /app/main.py inbound
directory=/app
autostart=true
autorestart=true
startretries=1000
startsecs=3
stopwaitsecs=10
stdout_logfile=/var/log/tally_connector/inbound.log
stderr_logfile=/var/log/tally_connector/inbound.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
